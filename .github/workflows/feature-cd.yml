# Feature CD. The same pull request into qa. The diff base is qa, because
# that is the pull request target. One comment, updated on later pushes,
# plus the coloured HTML as the erd artifact.

name: feature CD

on:
  pull_request:
    branches: [qa]

concurrency:
  group: feature-cd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: MarkPhamm/quickdbd-cli@v0.6.11
        with:
          path: docs/erd/*/
          site: site/
          strict: "true"
          comment: "true"
          upload-artifact: "true"
          qdbd-version: "0.6.11"
