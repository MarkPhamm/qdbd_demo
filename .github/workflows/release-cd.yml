# Release CD.
# main → check the schema. pages.yml then publishes prod and the open PR demos.
# qa   → the erd artifact on the run, no Pages deploy.

name: release CD

on:
  push:
    branches: [main, qa]

concurrency:
  group: release-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: MarkPhamm/quickdbd-cli@v0.6.11
        with:
          path: docs/erd/*/
          site: site
          strict: "true"
          comment: "false"
          upload-artifact: ${{ github.ref_name == 'qa' && 'true' || 'false' }}
          qdbd-version: "0.6.11"
