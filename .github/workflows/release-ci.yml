# Release CI. The pull request that promotes qa into main. Same check as
# feature CI, with the diff base set to main by the pull request target.

name: release CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: MarkPhamm/quickdbd-cli@v0.6.11
        with:
          path: docs/erd/*/
          site: site/
          strict: "true"
          comment: "true"
          upload-artifact: "true"
          qdbd-version: "0.6.11"
