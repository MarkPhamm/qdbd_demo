models:
  - name: fct_payments
    description: One row per payment. Order 4 has none because it is still placed.
    columns:
      - name: payment_id
        description: Grain of this fact, one row per payment.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order this payment settles. Matches fct_orders.
      - name: customer_id
        description: Customer on the parent order, repeated here so the payment can join without the order.
      - name: order_date
        description: Date of the parent order, repeated here for the same reason.
      - name: payment_method
        description: card or cash.
      - name: amount
        description: Money taken on this payment. Not always equal to the order total.
