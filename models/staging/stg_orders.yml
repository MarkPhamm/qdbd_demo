models:
  - name: stg_orders
    description: One row per order from erp.orders.
    columns:
      - name: order_id
        description: Stable key from erp.orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Who placed the order. Must exist on stg_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: Day the order was placed, cast to a date.
        data_tests:
          - not_null
      - name: status
        description: placed, completed, or returned.
        data_tests:
          - accepted_values:
              arguments:
                values: ["placed", "completed", "returned"]
